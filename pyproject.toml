[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "population-drq"
version = "0.1.0"
description = "Population-level Digital Red Queen algorithms and paper artifacts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy>=1.21",
  "matplotlib>=3.5",
  "google-genai>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
